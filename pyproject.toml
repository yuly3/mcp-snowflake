[project]
dependencies = [
    "anyio>=4.14.2",
    "attrs>=26.1.0",
    "cattrs-converter",
    "cattrs>=26.1.0",
    "expression",
    "kernel",
    "mcp>=2.0.0",
    "more-itertools>=11.1.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.4",
    "snowflake-connector-python[secure-local-storage]>=4.7.2",
    "snowflake-sql-parser",
]
description = "Model Context Protocol (MCP) server for Snowflake database connectivity and SQL query execution"
name = "mcp-snowflake"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
mcp-snowflake = "mcp_snowflake.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[tool.pyright]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
]
typeCheckingMode = "standard"

reportConstantRedefinition = "error"
reportDeprecated = "warning"
reportDuplicateImport = "error"
reportImportCycles = "error"
reportMatchNotExhaustive = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownLambdaType = "error"
reportUnknownVariableType = "information"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportUntypedBaseClass = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedNamedTuple = "warning"
reportUnusedCallResult = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "error"
strictDictionaryInference = true
strictListInference = true
strictSetInference = true

ignore = [
    ".env",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
cattrs-converter = { workspace = true }
expression = { workspace = true }
kernel = { workspace = true }
snowflake-sql-parser = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/cattrs-converter",
    "packages/expression",
    "packages/kernel",
    "packages/snowflake-sql-parser",
]
